<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101116">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <title>Opening sign in · Tajiri POS</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101116;
        --surface: rgb(28 28 34 / 88%);
        --line: rgb(214 180 119 / 22%);
        --text: #f7f3eb;
        --muted: #b8b2a6;
        --gold: #d6b477;
      }
      * { box-sizing: border-box; }
      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--text);
        background:
          radial-gradient(ellipse at 18% 12%, rgb(120 101 70 / 18%), transparent 34rem),
          radial-gradient(ellipse at 88% 90%, rgb(90 101 84 / 12%), transparent 30rem),
          var(--bg);
        font: 15px/1.55 "DM Sans", "Segoe UI", sans-serif;
      }
      .redirect-card {
        position: relative;
        width: min(100%, 440px);
        padding: 42px 34px 34px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: linear-gradient(145deg, rgb(34 34 40 / 96%), var(--surface));
        box-shadow: 0 28px 80px rgb(0 0 0 / 36%);
        text-align: center;
        animation: card-in 480ms ease-out both;
      }
      .redirect-card::before {
        position: absolute;
        top: -100px;
        left: 50%;
        width: 250px;
        height: 190px;
        border-radius: 50%;
        background: rgb(214 180 119 / 12%);
        content: "";
        filter: blur(34px);
        transform: translateX(-50%);
        pointer-events: none;
      }
      .brand-mark {
        position: relative;
        display: grid;
        width: 58px;
        height: 58px;
        margin: 0 auto 15px;
        place-items: center;
        border: 1px solid rgb(214 180 119 / 48%);
        border-radius: 19px;
        color: #211b12;
        background: linear-gradient(145deg, #ead5a8, var(--gold));
        box-shadow: 0 10px 30px rgb(173 137 78 / 22%);
        font: 800 31px/1 "Segoe UI", sans-serif;
      }
      .brand-name {
        position: relative;
        margin: 0;
        color: #e8dfce;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        position: relative;
        margin: 29px 0 8px;
        font: 600 clamp(1.55rem, 6vw, 1.9rem)/1.2 "Segoe UI", sans-serif;
        letter-spacing: -0.035em;
      }
      .message {
        position: relative;
        margin: 0;
        color: var(--muted);
      }
      .progress {
        width: 100%;
        height: 3px;
        margin: 27px 0 0;
        overflow: hidden;
        border-radius: 99px;
        background: rgb(255 255 255 / 8%);
      }
      .progress span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #b9955d, #ead5a8);
        animation: progress 1.2s ease-in-out infinite;
      }
      .secure-note {
        margin: 18px 0 0;
        color: #928c81;
        font-size: 0.78rem;
      }
      .secure-note span { color: var(--gold); }
      noscript a {
        display: inline-flex;
        min-height: 44px;
        margin-top: 22px;
        padding: 0 18px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--gold);
        border-radius: 11px;
        color: #211b12;
        background: var(--gold);
        font-weight: 700;
        text-decoration: none;
      }
      @keyframes progress {
        from { transform: translateX(-110%); }
        to { transform: translateX(250%); }
      }
      @keyframes card-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
      @media (max-width: 480px) {
        body { padding: 18px; }
        .redirect-card { padding: 36px 24px 28px; }
      }
    </style>
  </head>
  <body>
    <main class="redirect-card" aria-labelledby="redirectTitle">
      <span class="brand-mark" aria-hidden="true">t</span>
      <p class="brand-name">Tajiri POS</p>
      <h1 id="redirectTitle">Your workspace is ready.</h1>
      <p class="message" role="status" aria-live="polite">
        Securely opening your sign-in…
      </p>
      <div class="progress" aria-hidden="true"><span></span></div>
      <p class="secure-note"><span aria-hidden="true">●</span> Secure access to your shop</p>
      <noscript>
        <a href="index.html?login=1">Continue to sign in</a>
      </noscript>
    </main>
    <script>
      const signInUrl = new URL("index.html", window.location.href);
      signInUrl.searchParams.set("login", "1");
      const roleShell = new URLSearchParams(window.location.search)
        .get("roleShell")
        ?.toLowerCase();
      if (roleShell === "admin" || roleShell === "cashier") {
        signInUrl.searchParams.set("roleShell", roleShell);
      }
      if (new URLSearchParams(window.location.search).get("setPassword") === "1") {
        signInUrl.searchParams.set("setPassword", "1");
      }
      signInUrl.hash = window.location.hash;
      window.location.replace(signInUrl.href);
    </script>
  </body>
</html>
