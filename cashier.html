<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f17">
  <title>Cashier Dashboard · Tajiri POS</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 88% 0%, rgb(33 126 102 / 18%), transparent 34rem),
        #0b0f17;
    }
    iframe { display: block; width: 100%; height: 100vh; min-height: 100vh; border: 0; background: #0b0f17; }
  </style>
</head>
<body>
  <iframe title="Tajiri POS cashier dashboard" loading="eager"></iframe>
  <script>
    const appUrl = new URL("index.html", window.location.href);
    appUrl.searchParams.set("roleShell", "cashier");
    document.querySelector("iframe").src = appUrl.href;
  </script>
</body>
</html>
